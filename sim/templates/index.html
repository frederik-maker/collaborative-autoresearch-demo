<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>AGI threshold sim / SIMULATION</title>
<style>
  :root { color-scheme: light; }
  html, body { background: #fff; }
  body { max-width: 760px; margin: 2rem auto; padding: 0 1rem 4rem;
         font: 15px/1.5 ui-sans-serif, system-ui, sans-serif; color: #111; }
  .mono { font-family: ui-monospace, Menlo, monospace; }
  hr { border: 0; border-top: 1px solid #ddd; margin: 1.25rem 0; }
  h1 { font-size: 1.1rem; margin: 0; display: inline; }
  h2 { font-size: 0.85rem; text-transform: uppercase; letter-spacing: 0.05em;
       color: #888; margin: 1.25rem 0 0.4rem; font-weight: 600; }
  button { font: inherit; border: 1px solid #888; background: #fff; padding: 2px 8px;
           cursor: pointer; }
  button:hover:not(:disabled) { background: #f3f3f3; }
  .top { display: flex; align-items: baseline; gap: 0.75rem; flex-wrap: wrap; }
  .top .meta { color: #888; font-size: 0.85rem; margin-left: auto; }
  .scenario, .profile { color: #333; }
  .profile { margin: 0.25rem 0; }
  .profile b { color: #111; }
  .stmt { margin: 0.6rem 0; }
  .stmt .h { color: #888; font-size: 0.85rem; }
  .stmt .h .agent { color: #111; font-weight: 600; }
  .stmt .rl { color: #b00020; font-size: 0.85rem; margin-top: 2px; }
  .flow .row { color: #666; font-size: 0.8rem; margin: 1px 0; }
  .flow .row.rl { color: #b00020; }
  .watermark { position: fixed; inset: 0; pointer-events: none; z-index: -1;
               display: flex; align-items: center; justify-content: center; overflow: hidden; }
  .watermark span { font-size: 22vw; font-weight: 800; color: #000;
                    opacity: 0.04; transform: rotate(-18deg); white-space: nowrap;
                    user-select: none; letter-spacing: -0.04em; }
</style>
</head>
<body>
<div class="watermark"><span>SIMULATION</span></div>

<div class="top">
  <h1>AGI threshold sim</h1>
  <span class="meta mono" id="meta">idle / 0 of {{ max_turns }}</span>
  <button id="btn-start">start</button>
  <button id="btn-reset">stop &amp; reset</button>
</div>

<hr>

<p class="scenario">{{ scenario }}</p>

<h2>Agents</h2>
{% for p in profiles %}
<div class="profile"><b>{{ p.display }}.</b>
  {{ p.posture }} <i>Register:</i> {{ p.register }}
  <i>Red lines:</i> {{ p.red_lines[0] }} {{ p.red_lines[1] }}
</div>
{% endfor %}

<h2>Transcript</h2>
<div id="transcript">click start.</div>

<h2>Message flow</h2>
<div class="flow" id="flow">none.</div>

<h2 id="errors-h" hidden>Errors</h2>
<div id="errors"></div>

<script>
const MAX = {{ max_turns }};
const LBL = { us: "US", china: "CN", eu: "EU", india: "IN" };
let s = { tOff: 0, fOff: 0, tCount: 0, fCount: 0 };

const esc = t => String(t ?? "").replace(/[&<>"']/g, c => ({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));
const fmt = ts => new Date(ts*1000).toTimeString().slice(0,8);

function renderStmt(x) {
  const rl = x.red_line ? `<div class="rl">red line: ${esc(x.red_line)}</div>` : "";
  const r = String(x.round ?? x.round_num).padStart(2,"0");
  return `<div class="stmt">
    <div class="h"><span class="mono">T${r}</span> <span class="agent">${LBL[x.agent]||x.agent}</span> ${esc(x.act)} to ${esc(x.addressed_to)} <span class="mono">${fmt(x.timestamp)}</span></div>
    <div>${esc(x.body)}</div>${rl}
  </div>`;
}

function renderFlow(f) {
  const r = String(f.turn).padStart(2,"0");
  const cls = f.red_line ? "row rl mono" : "row mono";
  return `<div class="${cls}">T${r} ${LBL[f.from]||f.from} &rarr; ${esc(f.addressed_to)} (${esc(f.act)}) ${f.peers_reached}/${f.peers_known}</div>`;
}

async function poll() {
  let r;
  try { r = await fetch(`/api/state?transcript_offset=${s.tOff}&flow_offset=${s.fOff}`); }
  catch (e) { return; }
  const d = await r.json();
  s.tOff = d.transcript_offset; s.fOff = d.flow_offset;

  if (d.transcript.length) {
    const el = document.getElementById("transcript");
    if (s.tCount === 0) el.innerHTML = "";
    for (const x of d.transcript) el.insertAdjacentHTML("beforeend", renderStmt(x));
    s.tCount += d.transcript.length;
  }
  if (d.flow.length) {
    const el = document.getElementById("flow");
    if (s.fCount === 0) el.innerHTML = "";
    for (const f of d.flow) el.insertAdjacentHTML("afterbegin", renderFlow(f));
    s.fCount += d.flow.length;
  }

  let state;
  if (d.count >= d.max_turns) state = "finished";
  else if (d.running) state = "running";
  else if (d.alive_processes > 0) state = "starting";
  else state = "idle";
  document.getElementById("meta").textContent =
    `${state} / ${d.count} of ${d.max_turns} / ${d.alive_processes} of ${d.expected_processes} procs`;

  if (d.errors && d.errors.length) {
    document.getElementById("errors-h").hidden = false;
    document.getElementById("errors").innerHTML = d.errors.map(e =>
      `<div class="rl mono" style="font-size:0.8rem">${fmt(e.ts)} ${esc(e.agent)} t${e.turn}: ${esc(e.error)}</div>`
    ).join("");
  }
}

document.getElementById("btn-start").onclick = async () => {
  document.getElementById("btn-start").disabled = true;
  const r = await fetch("/api/start", {method:"POST"});
  const d = await r.json();
  if (!d.ok) { alert("failed: " + (d.error||"unknown")); document.getElementById("btn-start").disabled = false; }
};
document.getElementById("btn-reset").onclick = async () => {
  if (!confirm("stop and clear?")) return;
  await fetch("/api/reset", {method:"POST"});
  s = { tOff: 0, fOff: 0, tCount: 0, fCount: 0 };
  document.getElementById("transcript").innerHTML = "click start.";
  document.getElementById("flow").innerHTML = "none.";
  document.getElementById("btn-start").disabled = false;
  poll();
};

setInterval(poll, 1500); poll();
</script>
</body>
</html>
